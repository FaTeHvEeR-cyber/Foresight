[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
pythonpath = . config src app
markers =
    latency: latency and SLA timing tests
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore::DeprecationWarning:starlette
