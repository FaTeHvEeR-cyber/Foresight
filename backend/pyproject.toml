[project]
name = "foresight-backend"
version = "0.2.0"
description = "FastAPI backend for Foresight analytics platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.5.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "config",
    "src",
    "app",
]
